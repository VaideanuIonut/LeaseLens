spring:
  application:
    name: leaselens-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET:lease-lens-development-secret-key-change-me-32bytes}
  expiration: ${JWT_EXPIRATION:86400000}
